[package]
name = "device_virtio_scsi"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
license = "BSD-3-Clause"
edition = "2021"

[features]
registered_events = ["devices/registered_events"]

[dependencies]
anyhow = { workspace = true }
base = { workspace = true }
cfg-if = { workspace = true }
cros_async = { workspace = true }
cros_tracing = { workspace = true }
data_model = { workspace = true }
devices = { workspace = true }
disk = { workspace = true }
futures = { version = "0.3", features = ["async-await", "std"], default-features = false }
remain = { workspace = true }
serde = { workspace = true, features = [ "derive", "rc" ] }
serde_keyvalue = { workspace = true }
thiserror = { workspace = true }
virtio_sys = { workspace = true }
vm_memory = { workspace = true }
zerocopy = { version = "0.8.13", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
jail = { workspace = true }
minijail = "*"
